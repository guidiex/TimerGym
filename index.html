<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TimerGym</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family: Arial, sans-serif;

            background: #111;
            color: white;
        }


        /* =========================
           APP
        ========================= */

        .app {
            width: 100%;
            max-width: 420px;

            min-height: 100vh;

            margin: 0 auto;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 24px 20px;
        }


        /* =========================
           TITULO
        ========================= */

        h1 {
            margin: 0 0 28px;

            font-size: 18px;
            letter-spacing: 4px;
        }


        /* =========================
           TIMER
        ========================= */

        #timer {
            font-size: clamp(64px, 22vw, 96px);

            font-weight: bold;

            letter-spacing: 1px;

            margin: 0 0 24px;

            line-height: 1;
        }


        /* =========================
           BARRA DE ENERGIA
        ========================= */

        .energy {
            width: 100%;
            max-width: 300px;

            height: 6px;

            background: #292929;

            border-radius: 10px;

            overflow: hidden;

            margin-bottom: 28px;
        }


        #energyBar {
            width: 0%;
            height: 100%;

            background: #35d07f;

            transition: width 0.5s linear;
        }


        /* =========================
           CONTROLES +30 / -30
        ========================= */

        .adjust-controls {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 18px;

            margin-bottom: 22px;
        }


        .adjust {
            width: 58px;
            height: 58px;

            padding: 0;
            margin: 0;

            border-radius: 50%;

            background: transparent;

            font-size: 17px;
            font-weight: bold;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }


        #add30 {
            border: 2px solid #35d07f;
            color: #35d07f;
        }


        #remove30 {
            border: 2px solid #d93636;
            color: #d93636;
        }


        .adjust:active {
            transform: scale(0.94);
        }


        /* =========================
           BOTON PRINCIPAL
        ========================= */

        button {
            width: 100%;
            max-width: 300px;

            padding: 16px;

            margin: 5px;

            border: none;
            border-radius: 13px;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }


        #mainButton {
            background: #d93636;
            color: white;
        }


        /* CORRIENDO */

        #mainButton.running {
            background: #35d07f;
            color: #111;
        }


        /* PAUSADO */

        #mainButton.paused {
            background: #e0a52b;
            color: #111;
        }


        /* =========================
           RESET
        ========================= */

        #reset {
            background: #292929;
            color: white;
        }


        .hidden {
            display: none;
        }


        /* =========================
           WAKE LOCK INDICADOR
        ========================= */

        #wakeStatus {
            margin-top: 12px;

            font-size: 11px;

            letter-spacing: 1px;

            opacity: 0.45;
        }


        /* =========================
           ALERTA FLASH
        ========================= */

        body.flash {
            animation: flashScreen 0.18s linear 6;
        }


        @keyframes flashScreen {

            0% {
                background: #111;
            }

            50% {
                background: white;
            }

            100% {
                background: #111;
            }

        }


        /* =========================
           CELULARES PEQUEÑOS
        ========================= */

        @media (max-height: 650px) {

            .app {
                justify-content: flex-start;

                padding-top: 30px;
            }

            h1 {
                margin-bottom: 20px;
            }

            #timer {
                margin-bottom: 18px;
            }

            .energy {
                margin-bottom: 20px;
            }

            .adjust-controls {
                margin-bottom: 16px;
            }

        }

    </style>

</head>


<body>

    <div class="app">

        <h1>DESCANSO</h1>


        <div id="timer">
            01:30
        </div>


        <div class="energy">
            <div id="energyBar"></div>
        </div>


        <!-- AJUSTE DE TIEMPO -->

        <div class="adjust-controls">

            <button
                id="remove30"
                class="adjust"
                aria-label="Restar 30 segundos">

                −30

            </button>


            <button
                id="add30"
                class="adjust"
                aria-label="Agregar 30 segundos">

                +30

            </button>

        </div>


        <!-- BOTON PRINCIPAL -->

        <button id="mainButton">
            INICIAR
        </button>


        <!-- REINICIAR -->

        <button
            id="reset"
            class="hidden">

            REINICIAR

        </button>


        <!-- ESTADO WAKE LOCK -->

        <div id="wakeStatus"></div>

    </div>



    <script>

        /* =========================
           CONFIGURACION
        ========================= */

        const DURACION = 90;


        /* =========================
           ESTADO
        ========================= */

        let segundos = DURACION;

        let intervalo = null;

        let estado = "ready";

        let wakeLock = null;


        /* =========================
           ELEMENTOS
        ========================= */

        const timer =
            document.getElementById("timer");

        const mainButton =
            document.getElementById("mainButton");

        const reset =
            document.getElementById("reset");

        const add30 =
            document.getElementById("add30");

        const remove30 =
            document.getElementById("remove30");

        const energyBar =
            document.getElementById("energyBar");

        const wakeStatus =
            document.getElementById("wakeStatus");


        /* =========================
           ACTUALIZAR PANTALLA
        ========================= */

        function actualizarPantalla() {

            const minutos =
                Math.floor(segundos / 60);

            const segundosRestantes =
                segundos % 60;


            timer.textContent =
                String(minutos).padStart(2, "0") +
                ":" +
                String(segundosRestantes).padStart(2, "0");


            /*
                La barra representa el progreso
                respecto de los 90 segundos iniciales.
            */

            const progreso =
                Math.min(
                    ((DURACION - segundos) / DURACION) * 100,
                    100
                );


            energyBar.style.width =
                progreso + "%";

        }


        /* =========================
           ACTUALIZAR BOTON
        ========================= */

        function actualizarBoton() {

            mainButton.classList.remove("running");
            mainButton.classList.remove("paused");


            if (estado === "ready") {

                mainButton.textContent =
                    "INICIAR";

            }


            if (estado === "running") {

                mainButton.textContent =
                    "PAUSAR";

                mainButton.classList.add("running");

            }


            if (estado === "paused") {

                mainButton.textContent =
                    "CONTINUAR";

                mainButton.classList.add("paused");

            }

        }


        /* =========================
           RESET
        ========================= */

        function mostrarReset(mostrar) {

            reset.classList.toggle(
                "hidden",
                !mostrar
            );

        }


        /* =========================
           ALERTA VISUAL
        ========================= */

        function activarAlerta() {

            document.body.classList.remove("flash");

            /*
                Fuerza el navegador a reiniciar
                la animación.
            */

            void document.body.offsetWidth;

            document.body.classList.add("flash");


            setTimeout(function () {

                document.body.classList.remove("flash");

            }, 1100);

        }


        /* =========================
           WAKE LOCK
        ========================= */

        async function mantenerPantallaEncendida() {

            /*
                Si el navegador no soporta
                Screen Wake Lock, simplemente
                continuamos normalmente.
            */

            if (!("wakeLock" in navigator)) {

                wakeStatus.textContent =
                    "";

                return;

            }


            try {

                wakeLock =
                    await navigator.wakeLock.request(
                        "screen"
                    );


                wakeStatus.textContent =
                    "● PANTALLA ACTIVA";


                /*
                    Si el sistema libera el Wake Lock,
                    dejamos la referencia preparada
                    para recuperarlo al volver a la app.
                */

                wakeLock.addEventListener(
                    "release",
                    function () {

                        wakeStatus.textContent =
                            "";

                    }
                );


            } catch (error) {

                console.log(
                    "Wake Lock no disponible:",
                    error
                );

                wakeStatus.textContent =
                    "";

            }

        }


        /* =========================
           LIBERAR WAKE LOCK
        ========================= */

        async function liberarPantalla() {

            if (wakeLock) {

                try {

                    await wakeLock.release();

                } catch (error) {

                    console.log(error);

                }

                wakeLock = null;

            }


            wakeStatus.textContent =
                "";

        }


        /* =========================
           RECUPERAR WAKE LOCK
        ========================= */

        document.addEventListener(
            "visibilitychange",
            async function () {

                /*
                    Si volvemos a la app mientras
                    el timer sigue corriendo,
                    solicitamos nuevamente Wake Lock.
                */

                if (
                    document.visibilityState === "visible" &&
                    estado === "running"
                ) {

                    await mantenerPantallaEncendida();

                }

            }
        );


        /* =========================
           INICIAR TIMER
        ========================= */

        function iniciarTimer() {

            intervalo =
                setInterval(function () {

                    segundos--;

                    actualizarPantalla();


                    /* FIN DEL DESCANSO */

                    if (segundos <= 0) {

                        clearInterval(intervalo);

                        intervalo = null;

                        segundos = 0;

                        estado = "ready";


                        actualizarPantalla();

                        actualizarBoton();

                        mostrarReset(false);


                        /*
                            Liberamos la pantalla
                            al terminar.
                        */

                        liberarPantalla();


                        /*
                            Activamos la alerta.
                        */

                        activarAlerta();

                    }

                }, 1000);

        }


        /* =========================
           BOTON PRINCIPAL
        ========================= */

        mainButton.addEventListener(
            "click",
            async function () {


                /* =====================
                   INICIAR
                ===================== */

                if (estado === "ready") {

                    /*
                        Si estaba en cero,
                        comenzamos un nuevo
                        descanso de 90 segundos.
                    */

                    if (segundos <= 0) {

                        segundos = DURACION;

                        actualizarPantalla();

                    }


                    estado = "running";


                    actualizarBoton();

                    mostrarReset(false);


                    /*
                        Activamos Wake Lock.
                    */

                    await mantenerPantallaEncendida();


                    iniciarTimer();

                    return;

                }


                /* =====================
                   PAUSAR
                ===================== */

                if (estado === "running") {

                    clearInterval(intervalo);

                    intervalo = null;

                    estado = "paused";


                    actualizarBoton();

                    mostrarReset(true);


                    /*
                        Al pausar ya no necesitamos
                        mantener la pantalla encendida.
                    */

                    await liberarPantalla();

                    return;

                }


                /* =====================
                   CONTINUAR
                ===================== */

                if (estado === "paused") {

                    estado = "running";


                    actualizarBoton();

                    mostrarReset(false);


                    /*
                        Volvemos a activar Wake Lock.
                    */

                    await mantenerPantallaEncendida();


                    iniciarTimer();

                    return;

                }

            }
        );


        /* =========================
           +30 SEGUNDOS
        ========================= */

        add30.addEventListener(
            "click",
            function () {

                segundos += 30;

                actualizarPantalla();

            }
        );


        /* =========================
           -30 SEGUNDOS
        ========================= */

        remove30.addEventListener(
            "click",
            async function () {

                segundos =
                    Math.max(
                        0,
                        segundos - 30
                    );


                actualizarPantalla();


                /*
                    Si llega a cero mientras
                    está corriendo, terminamos
                    inmediatamente.
                */

                if (
                    segundos === 0 &&
                    estado === "running"
                ) {

                    clearInterval(intervalo);

                    intervalo = null;

                    estado = "ready";


                    await liberarPantalla();


                    actualizarBoton();

                    mostrarReset(false);


                    activarAlerta();

                }

            }
        );


        /* =========================
           REINICIAR
        ========================= */

        reset.addEventListener(
            "click",
            async function () {

                clearInterval(intervalo);

                intervalo = null;


                await liberarPantalla();


                segundos = DURACION;

                estado = "ready";


                actualizarPantalla();

                actualizarBoton();

                mostrarReset(false);

            }
        );


        /* =========================
           INICIALIZAR
        ========================= */

        actualizarPantalla();

        actualizarBoton();

        mostrarReset(false);

    </script>

</body>

</html>
